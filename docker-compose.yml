services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cptracker
      POSTGRES_USER: cptracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a random database password in .env}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cptracker -d cptracker"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn --bind 0.0.0.0:8000 --timeout 120 cptracker_project.wsgi:application"
    ports: ["127.0.0.1:8000:8000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://cptracker:${POSTGRES_PASSWORD}@db:5432/cptracker
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
