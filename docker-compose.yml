version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: cptracker_db
      POSTGRES_USER: cptracker_user
      POSTGRES_PASSWORD: cptracker_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cptracker_user -d cptracker_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: >
      bash -c "python manage.py migrate &&
               gunicorn --bind 0.0.0.0:8000 cptracker_project.wsgi:application"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DATABASE_URL=postgres://cptracker_user:cptracker_password@db:5432/cptracker_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
