{% extends 'tracker/base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-900">Settings</h1>
        <p class="mt-2 text-sm text-gray-600">Manage your connected competitive programming accounts.</p>
    </div>

    <div class="bg-white shadow-sm ring-1 ring-gray-200 rounded-xl overflow-hidden mb-8">
        <div class="px-4 py-5 sm:p-6">
            <h3 class="text-base font-semibold leading-6 text-gray-900">Add or Update Handle</h3>
            <div class="mt-2 max-w-xl text-sm text-gray-500">
                <p>Link your account to fetch your total solved problems.</p>
            </div>
            <form class="mt-5 sm:flex sm:items-center" method="post" action="{% url 'settings' %}">
                {% csrf_token %}
                <div class="w-full sm:max-w-xs">
                    <label for="platform" class="sr-only">Platform</label>
                    <select id="platform" name="platform" class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6">
                        <option value="CF">Codeforces</option>
                        <option value="CC">CodeChef</option>
                        <option value="AC">AtCoder</option>
                        <option value="LC">LeetCode</option>
                    </select>
                </div>
                <div class="w-full sm:max-w-xs sm:ml-3 mt-3 sm:mt-0">
                    <label for="handle" class="sr-only">Handle</label>
                    <input type="text" name="handle" id="handle" class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6" placeholder="Enter handle" required>
                </div>
                <button type="submit" class="mt-3 inline-flex w-full items-center justify-center rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 sm:ml-3 sm:mt-0 sm:w-auto">
                    Save
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
