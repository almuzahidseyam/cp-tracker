<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CP Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="h-full flex flex-col text-slate-900 antialiased selection:bg-indigo-100 selection:text-indigo-900">
    <!-- Premium Glassmorphism Navbar -->
    <nav class="sticky top-0 z-50 backdrop-blur-md bg-white/70 border-b border-slate-200/80">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
            <div class="flex h-16 justify-between items-center">
                <div class="flex">
                    <a href="{% url 'dashboard' %}" class="flex flex-shrink-0 items-center gap-2 group">
                        <div class="bg-indigo-600 text-white rounded-lg p-1.5 shadow-sm group-hover:bg-indigo-700 transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        </div>
                        <span class="font-bold text-lg tracking-tight text-slate-900">CP Tracker</span>
                    </a>
                </div>
                <div class="flex items-center gap-4">
                    {% if user.is_authenticated %}
                        <a href="{% url 'dashboard' %}" class="text-sm font-medium text-slate-600 hover:text-slate-900 transition-colors">Dashboard</a>
                        <a href="{% url 'leaderboard' %}" class="text-sm font-medium text-slate-600 hover:text-slate-900 transition-colors">Leaderboard</a>
                        <span class="text-slate-300">|</span>
                        <span class="text-sm font-medium text-slate-500">{{ user.email }}</span>
                        <form action="{% url 'logout' %}" method="post" class="inline">
                            {% csrf_token %}
                            <button type="submit" class="text-sm font-medium text-indigo-600 hover:text-indigo-700 transition-colors">Logout</button>
                        </form>
                    {% else %}
                        <a href="{% url 'login' %}" class="text-sm font-medium text-indigo-600 hover:text-indigo-700 transition-colors">Login / Signup</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-grow">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-10">
            {% block content %}
            {% endblock %}
        </div>
    </main>

    <!-- Simple Footer -->
    <footer class="mt-auto py-8 text-center text-sm text-slate-400">
        <p>&copy; {% now "Y" %} CP Tracker. Built with Django & Tailwind CSS.</p>
    </footer>
</body>
</html>
