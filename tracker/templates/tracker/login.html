{% extends 'tracker/base.html' %}{% block content %}<section class="max-w-md mx-auto my-10 bg-white border border-slate-200 rounded-xl p-8"><h1 class="text-2xl font-semibold mb-3">Sign in to CP Tracker</h1><p class="text-slate-600 text-sm mb-6">Receive a six-digit code in your email. Each code expires in five minutes and works once.</p><form method="post" action="{% url 'login' %}" class="space-y-5">{% csrf_token %}<div><label for="email" class="block text-sm font-medium mb-2">Email address</label><input id="email" name="email" type="email" maxlength="254" autocomplete="email" required class="w-full rounded-lg border-slate-300 border p-3" placeholder="you@example.com"></div><button class="w-full bg-slate-800 text-white rounded-lg p-3 font-medium">Send login code</button></form><p class="text-sm text-slate-500 mt-5">Wait at least one minute before requesting another code. A new code replaces the previous one.</p></section>{% endblock %}
