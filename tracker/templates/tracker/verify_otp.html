{% extends 'tracker/base.html' %}

{% block content %}
<div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-sm">
    <h2 class="mt-10 text-center text-2xl font-bold leading-9 tracking-tight text-gray-900">Verify your identity</h2>
    <p class="mt-2 text-center text-sm text-gray-600">Enter the 6-digit code sent to <span class="font-medium">{{ email }}</span>.</p>
  </div>

  <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm bg-white p-8 shadow-sm ring-1 ring-gray-200 rounded-xl">
    <form class="space-y-6" action="{% url 'verify_otp' %}" method="POST">
        {% csrf_token %}
      <div>
        <label for="otp" class="block text-sm font-medium leading-6 text-gray-900">Security Code</label>
        <div class="mt-2">
          <input id="otp" name="otp" type="text" required class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6 text-center tracking-[0.5em] font-mono text-xl" placeholder="••••••" maxlength="6">
        </div>
      </div>

      <div>
        <button type="submit" class="flex w-full justify-center rounded-md bg-indigo-600 px-3 py-1.5 text-sm font-semibold leading-6 text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">Verify and Login</button>
      </div>
    </form>
    
    <div class="mt-4 text-center">
        <a href="{% url 'login' %}" class="text-sm font-medium text-indigo-600 hover:text-indigo-500">Use a different email</a>
    </div>
  </div>
</div>
{% endblock %}
