name: Verify authentication and statistics
on: [push, pull_request]
permissions:
  contents: read
env:
  SECRET_KEY: ci-fixture-only-0123456789-abcdefghijklmnopqrstuvwxyz-1234567890
  DEBUG: 'True'
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements.txt pip-audit -c constraints.txt
      - run: npm ci
      - run: npm run build:css
      - run: git diff --exit-code -- static/app.css
      - run: python manage.py test
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py collectstatic --noinput
      - run: python -m pip_audit -r requirements.txt
      - run: npm audit --audit-level=moderate
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cptracker
          POSTGRES_USER: cptracker
          POSTGRES_PASSWORD: ci-fixture-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U cptracker" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://cptracker:ci-fixture-only@127.0.0.1:5432/cptracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python manage.py test
